name: 🖥️ Auto PR Creation (Client)

on:
  push:
    branches:
      - 'TEM-*'

jobs:
  create-pr:
    permissions:
      contents: read
      pull-requests: write
    uses: T-ESP-ASSTAGJ/infra/.github/workflows/reusable_pr-creation.yml@main
    with:
      repository_name: "client"
      base_branch: "staging"
    secrets:
      AUTO_DEPLOY_TOKEN: ${{ secrets.AUTO_DEPLOY_TOKEN }}